<rect x="620" y="374" width="26" height="2" rx="1" fill="#9f1c20"/>
<text x="620" y="396" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">Signing is a named, credentialed act, so the confirmation restates who is about to sign before</text>
<text x="620" y="411" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">anything is committed. One deliberate step between writing a note and standing behind it.</text>
