<text x="40" y="800" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">Final and attributed: name, credential, timestamp. Editing ends here &#8212; a correction is a new note.</text>
<rect x="620" y="778" width="26" height="2" rx="1" fill="#9f1c20"/>
<text x="620" y="800" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">The same draft read by a therapist from another discipline. Row-Level Security in Postgres, not the</text>
<text x="620" y="815" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">interface, is what makes it read-only &#8212; the UI only declines to offer what the database would refuse.</text>
