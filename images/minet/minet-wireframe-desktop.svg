<circle cx="250" cy="692" r="13" fill="#9f1c20" stroke="#ffffff" stroke-width="2"/>
<text x="250" y="696.68" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<circle cx="52" cy="772" r="12" fill="#9f1c20"/>
<text x="52" y="776.4" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="74" y="777" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Eight destinations, one level</text>
<text x="74" y="797" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">Nothing the counter needs is nested. Inventory, the</text>
<text x="74" y="812" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">till and the day&#8217;s takings are each one tap away.</text>
<circle cx="440" cy="772" r="12" fill="#9f1c20"/>
<text x="440" y="776.4" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="462" y="777" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">The till is a place, not a mode</text>
<text x="462" y="797" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">Point of Sale sits third because it is used most: a</text>
<text x="462" y="812" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">room you walk into, not a state to switch out of.</text>
<circle cx="828" cy="772" r="12" fill="#9f1c20"/>
<text x="828" y="776.4" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="850" y="777" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Five numbers open the day</text>
<text x="850" y="797" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">Takings, items, two kinds of stock warning, and what</text>
<text x="850" y="812" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">the shelves are worth &#8212; read before the door unlocks.</text>
<circle cx="52" cy="840" r="12" fill="#9f1c20"/>
<text x="52" y="844.4" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="74" y="845" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Low stock and expiry, counted apart</text>
<text x="74" y="865" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">They look alike and are not. One is a reorder; the</text>
<text x="74" y="880" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">other is a write-off with a deadline on it.</text>
<circle cx="440" cy="840" r="12" fill="#9f1c20"/>
<text x="440" y="844.4" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="462" y="845" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Thirty days, not today</text>
<text x="462" y="865" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">A rural pharmacy&#8217;s week is uneven, so one day&#8217;s takings</text>
<text x="462" y="880" font-size="11" fill="#6f6a60" font-weight="400" text-anchor="start">mean little without the line behind them.</text>
<circle cx="828" cy="840" r="12" fill="#9f1c20"/>
<text x="828" y="844.4" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="850" y="845" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Who is on the till</text>
