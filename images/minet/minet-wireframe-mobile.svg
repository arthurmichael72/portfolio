<rect x="76" y="712" width="26" height="2" rx="1" fill="#9f1c20"/>
<text x="76" y="740" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Every sale, pushed</text>
<text x="76" y="760" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">The owner is not asked to open anything. A completed sale arrives</text>
<text x="76" y="775" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">as a notification with the amount, the count, the payment method</text>
<text x="76" y="790" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">and the name of whoever rang it up &#8212; from three time zones away.</text>
<rect x="441" y="712" width="26" height="2" rx="1" fill="#9f1c20"/>
<text x="441" y="740" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">A day you can read in one glance</text>
<text x="441" y="760" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">Takings and items against yesterday, the week behind them, and</text>
<text x="441" y="775" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">the last four transactions as they land. It is a monitor, not a</text>
<text x="441" y="790" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">second till: nothing here can change what the shop recorded.</text>
<rect x="806" y="712" width="26" height="2" rx="1" fill="#9f1c20"/>
<text x="806" y="740" font-size="13.5" fill="#394a62" font-weight="700" text-anchor="start">Warnings that name the remedy</text>
<text x="806" y="760" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">Out of stock, running low, expiring, expired &#8212; each severity-coded</text>
<text x="806" y="775" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">and each carrying the one action it implies. Reorder, view the</text>
<text x="806" y="790" font-size="10" fill="#6f6a60" font-weight="400" text-anchor="start">batch, or write it off, from the phone, before the shelf is empty.</text>
